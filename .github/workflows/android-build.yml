name: Build BenchMap Android

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure clean properties for runner
      run: |
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK and Bundle
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BenchMap-APKs
        path: app/build/outputs/apk/

    - name: Upload Bundle Artifact (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: BenchMap-AAB
        path: app/build/outputs/bundle/

    - name: Prepare GitHub Release Assets
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        mkdir -p release-assets
        # Release APK
        find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/BenchMap-${{ github.ref_name }}-release.apk \;
        # Debug APK
        find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/BenchMap-${{ github.ref_name }}-debug.apk \;
        # Release AAB Bundle
        find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-assets/BenchMap-${{ github.ref_name }}-release.aab \;
        ls -la release-assets/

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        name: Bancs Publics (BenchMap) ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ### Bancs Publics (BenchMap) ${{ github.ref_name }} — Montreal Offline Vector Map

          100% Native, zero-cloud vector map and public bench navigator for Montreal.

          #### Highlights:
          - **🧭 Integrated Swiss Compass**: Built directly into the top header bar (last icon on the right) with real-time True North needle tracking and one-tap re-alignment & zoom.
          - **🔍 Civic Address & Location Search Engine**: Geocoded search for civic addresses (e.g., 3450 Saint-Urbain), streets, parks, neighborhoods, and GPS coordinates with auto-center.
          - **◆ Custom Bench Creation ("Mes bancs")**: Long-press on open space to add benches discovered in the field with a distinct diamond glyph (`◆`), material, backrest, and photo capture.
          - **🖼 Fullscreen OLED Black Photo Viewer**: Immersive photo inspection in pure black (`#000000`) with edge-to-edge camera cutout support.
          - **📐 Touch Physics & Gesture Isolation**: Complete elimination of accidental clicks or long-presses during pinch-to-zoom and pan gestures.
          - **🎨 8 Map Rendering Styles & Daily Rotation**: Clean Minimal, Architectural Hairline, Bauhaus Gras, Cadastre Tireté, Double Casing, Tracé Artistique, Matrice Pointillée, Noir Argentique.
          - **🌊 Authentic Physical Island Shorelines**: Real physical shorelines for Île de Montréal, Île des Sœurs, Île Sainte-Hélène, Île Notre-Dame, Île Bizard, and Île de la Visitation.
          - **9,602 Montreal Public Benches**: Spatially indexed with street names, park associations, materials, backrest status, and coordinates.
          - **Ultra-Fast Binary Map Format**: Custom IEEE 754 float binary format (`montreal_map.bin`) loading cartography in <70 ms.
          - **Dual Minimalist Themes**: Nordic Paper (Light) & Nocturne (Dark / OLED).
          - **🤝 Rendez-vous à mi-chemin**: 100% local, zero-server coordinate beacon exchange for discovering halfway benches between friends.

          #### Assets:
          - `BenchMap-${{ github.ref_name }}-release.apk`: Production-ready Android APK
          - `BenchMap-${{ github.ref_name }}-release.aab`: Google Play Store App Bundle
          - `BenchMap-${{ github.ref_name }}-debug.apk`: Debug APK with logging enabled
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
