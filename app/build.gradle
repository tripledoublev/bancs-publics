plugins {
    id 'com.android.application'
}

android {
    namespace 'map.bench.bancs_publics'
    compileSdk 36

    defaultConfig {
        applicationId "map.bench.bancs_publics"
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName "0.2.11"
    }

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            def props = new Properties()
            if (keystorePropsFile.exists()) {
                keystorePropsFile.withInputStream { props.load(it) }
            }

            def storeFilePath = System.getenv("KEYSTORE_FILE") ?: props.getProperty('storeFile')
            def storePass = System.getenv("KEYSTORE_PASSWORD") ?: props.getProperty('storePassword')
            def keyAliasVal = System.getenv("KEY_ALIAS") ?: props.getProperty('keyAlias')
            def keyPass = System.getenv("KEY_PASSWORD") ?: props.getProperty('keyPassword')

            if (storeFilePath && file(storeFilePath).exists() && storePass) {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias keyAliasVal ?: 'benchmap-upload'
                keyPassword keyPass ?: storePass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
