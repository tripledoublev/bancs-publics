plugins {
    id 'com.android.application'
}

android {
    namespace 'com.machine.benchmap'
    compileSdk 34

    defaultConfig {
        applicationId "com.machine.benchmap"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "0.2.4"
    }

    signingConfigs {
        release {
            def ksFile = file('../benchmap-release.jks')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'benchmap2026mtl'
                keyAlias System.getenv("KEY_ALIAS") ?: 'benchmap'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'benchmap2026mtl'
            }
        }
    }

    buildTypes {
        release {
            def ksFile = file('../benchmap-release.jks')
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
